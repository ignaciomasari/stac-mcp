# STAC MCP Server - Docker Compose for VM deployment
# Runs the MCP server with HTTP transport on port 8000.
# MCP clients can connect to http://<host>:8000
version: '3.8'

services:
  stac-mcp:
    build:
      context: .
      dockerfile: Containerfile
    # HTTP transport: expose port 8000 for MCP clients
    ports:
      - "8000:8000"
    # Bind to 0.0.0.0 inside container (already set in Containerfile CMD)
    # For stdio transport instead, override command:
    # command: ["--transport", "stdio"]
    # stdin_open: true
    # tty: true
    environment:
      - PYTHONUNBUFFERED=1
    # Resource limits for production deployment
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'